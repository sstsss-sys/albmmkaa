name: Update Apple Music Albums

on:
  workflow_dispatch:

jobs:
  update-albums:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Etalase (Public)
        uses: actions/checkout@v4

      - name: Checkout Dapur (Private)
        uses: actions/checkout@v4
        with:
          repository: sstsss-sys/apple-music-album-private
          path: apple-music-album-private
          token: ${{ secrets.PAT_ALBUMKAA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apple-music-album-private
        run: npm install

      - name: Install Playwright
        working-directory: apple-music-album-private
        run: npx playwright install chromium --with-deps

      - name: Sync ALL JSON to Dapur
        run: |
          # COPY SEMUA FILE JSON TANPA TERKECUALI agar skrip tidak kelaparan data
          cp -f *.json apple-music-album-private/

      - name: Run Scraper
        working-directory: apple-music-album-private
        run: node realtime-albums.js

      - name: Move result back to Etalase
        run: |
          # Pindahkan hasil dari Dapur ke root Etalase
          cp -f apple-music-album-private/*.json .

      - name: Commit and Push to Etalase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --staged --quiet || git commit -m "Sync & Update Album Data"
          git push
