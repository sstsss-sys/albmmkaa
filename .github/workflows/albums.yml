name: Update Apple Music Albums

on:
  workflow_dispatch:

jobs:
  update-albums:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Etalase (Public)
        uses: actions/checkout@v4

      - name: Checkout Dapur (Private)
        uses: actions/checkout@v4
        with:
          repository: sstsss-sys/apple-music-album-private
          path: apple-music-album-private
          token: ${{ secrets.PAT_ALBUM }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apple-music-album-private
        run: npm install

      - name: Install Playwright
        working-directory: apple-music-album-private
        run: npx playwright install chromium --with-deps

      - name: Run Scraper
        working-directory: apple-music-album-private
        run: node realtime-albums.js

      - name: Move result to Etalase
        run: |
          # Copy file JSON hasil generate ke repo publik
          cp -f apple-music-album-private/apple-music-albums-realtime.json .
          # Opsional: Jika ingin mempublikasikan file history juga
          cp -f apple-music-album-private/apple-music-albums-history.json . || true

      - name: Commit and Push to Etalase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --staged --quiet || git commit -m "Update Apple Music albums data"
          git push
