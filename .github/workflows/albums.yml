name: Update Apple Music Albums

on:
  workflow_dispatch:

jobs:
  update-albums:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Clone private repo
        run: |
          git clone https://x-access-token:${{ secrets.PAT_ALBUM }}@github.com/sstsss-sys/apple-music-album-private.git

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apple-music-album-private
        run: npm install

      - name: Install Playwright
        working-directory: apple-music-album-private
        run: npx playwright install chromium --with-deps

      - name: Sync history to private
        run: |
          cp -f us-albums-history.json apple-music-album-private/
          cp -f apple-music-albums-history.json apple-music-album-private/
          cp -f apple-music-albums-all-history.json apple-music-album-private/

      - name: Run Scraper
        working-directory: apple-music-album-private
        run: node realtime-albums.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Copy balik 4 file spesifik ke root
          cp -f apple-music-album-private/us-albums-history.json .
          cp -f apple-music-album-private/apple-music-albums-history.json .
          cp -f apple-music-album-private/apple-music-albums-all-history.json .
          cp -f apple-music-album-private/apple-music-albums-realtime.json .
          
          # Rem Darurat: Cek apakah isi konten 4 file ini berubah
          git add us-albums-history.json apple-music-albums-history.json apple-music-albums-all-history.json apple-music-albums-realtime.json
          
          if git diff --cached --quiet; then
            echo "4 file tidak ada perubahan konten. Skip push."
          else
            git commit -m "Auto Update: Scrape Success"
            git push
          fi
          
