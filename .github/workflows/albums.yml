name: Update Apple Music Albums

on:
  workflow_dispatch:

jobs:
  update-albums:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Etalase (Public)
        uses: actions/checkout@v4

      - name: Checkout Dapur (Private)
        uses: actions/checkout@v4
        with:
          repository: sstsss-sys/apple-music-album-private
          path: apple-music-album-private
          token: ${{ secrets.PAT_ALBUM }}

      - name: Sync ALL JSON to Dapur
        run: |
          # Perintah ini memaksa SEMUA file .json masuk ke folder skrip
          # agar us-albums-history.json terbaca oleh skrip.
          cp -f *.json apple-music-album-private/

      - name: Setup Node & Run
        working-directory: apple-music-album-private
        run: |
          npm install
          npx playwright install chromium --with-deps
          node realtime-albums.js

      - name: Move result back to Etalase
        run: |
          # Mengambil kembali hasil update dan file history yang sudah ter-update
          cp -f apple-music-album-private/*.json .

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --staged --quiet || git commit -m "Auto Update: Sync & Scrape"
          git push
          
