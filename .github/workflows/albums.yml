name: Update Apple Music Albums

on:
  workflow_dispatch:

jobs:
  update-albums:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Clone private repo
        run: |
          git clone https://x-access-token:${{ secrets.PAT_ALBUM }}@github.com/sstsss-sys/apple-music-album-private.git

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apple-music-album-private
        run: npm install

      - name: Install Playwright
        working-directory: apple-music-album-private
        run: npx playwright install chromium --with-deps

      - name: Copy history files to private repo
        run: |
          cp -f us-albums-history.json apple-music-album-private/
          cp -f apple-music-albums-history.json apple-music-album-private/
          cp -f apple-music-albums-all-history.json apple-music-album-private/

      - name: Run Scraper
        working-directory: apple-music-album-private
        run: node realtime-albums.js

      - name: Copy generated files
        run: |
          cp -f apple-music-album-private/*.json . 2>/dev/null || true

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add us-albums-history.json
          git add apple-music-albums-history.json
          git add apple-music-albums-all-history.json
          git add apple-music-albums-realtime.json

          # Cek perubahan konten, kalau nggak ada perubahan, nggak usah commit/push
          git diff --staged --quiet || git commit -m "update apple music albums"
          git diff --quiet || git push
          
